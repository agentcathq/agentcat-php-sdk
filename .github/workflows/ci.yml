name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
      - run: composer validate --strict
      - run: composer normalize --dry-run
      - run: vendor/bin/php-cs-fixer check --diff
      - run: vendor/bin/rector process --dry-run
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github
      - run: vendor/bin/composer-dependency-analyser
      - run: composer audit

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        deps: [lowest, highest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.deps }}
      - run: vendor/bin/phpunit

  tests-next:
    name: Tests (PHP 8.6, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.6'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
      - run: vendor/bin/phpunit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
      - run: vendor/bin/phpunit --coverage-clover .cache/clover.xml
      - name: Require at least 95 percent line coverage
        run: |
          php <<'PHP'
          <?php
          $xml = simplexml_load_file('.cache/clover.xml');
          $metrics = $xml->project->metrics;
          $statements = (int) $metrics['statements'];
          $covered = (int) $metrics['coveredstatements'];
          $percent = $statements === 0 ? 100.0 : 100.0 * $covered / $statements;
          printf("Line coverage: %.2f%% (%d of %d)\n", $percent, $covered, $statements);
          exit($percent < 95.0 ? 1 : 0);
          PHP

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
      - name: Mutation tests on changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          vendor/bin/infection --threads=max --git-diff-lines
          --git-diff-base=origin/"$BASE_REF"
          --min-covered-msi=95 --logger-github --ignore-msi-with-no-mutations
      - name: Mutation tests (full)
        if: github.event_name != 'pull_request'
        run: vendor/bin/infection --threads=max --logger-github

  mcp-sdk-main:
    name: mcp/sdk main (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
      - name: Install mcp/sdk main at the commit this release was verified against
        run: composer require --dev --no-interaction --update-with-all-dependencies "mcp/sdk:dev-main#82e19d114e95671e05e7df7909195f7ace03d90e as 0.9.0"
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github
      - run: vendor/bin/phpunit --testsuite Contract,Integration,E2E

  all-green:
    name: All green
    if: always()
    needs: [static, tests, coverage, mutation, mcp-sdk-main]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
