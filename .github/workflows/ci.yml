name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
      - run: composer validate --strict
      - run: composer normalize --dry-run
      - run: vendor/bin/php-cs-fixer check --diff
      - run: vendor/bin/rector process --dry-run
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=1G
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=1G --configuration=phpstan.php85.neon
      - run: vendor/bin/composer-dependency-analyser
      - run: composer audit

  static-lowest:
    name: Static analysis (lowest dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: lowest
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=1G
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=1G --configuration=phpstan.php85.neon

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        deps: [lowest, highest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.deps }}
      - run: vendor/bin/phpunit

  tests-next:
    name: Tests (PHP 8.6, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.6'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
          # ergebnis/composer-normalize caps PHP below 8.6.
          composer-options: --ignore-platform-req=php+
      - run: vendor/bin/phpunit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
      - run: vendor/bin/phpunit --coverage-clover .cache/clover.xml
      - name: Require at least 95 percent line coverage
        run: |
          php <<'PHP'
          <?php
          $xml = simplexml_load_file('.cache/clover.xml');
          $metrics = $xml->project->metrics;
          $statements = (int) $metrics['statements'];
          $covered = (int) $metrics['coveredstatements'];
          $percent = $statements === 0 ? 100.0 : 100.0 * $covered / $statements;
          printf("Line coverage: %.2f%% (%d of %d)\n", $percent, $covered, $statements);
          exit($percent < 95.0 ? 1 : 0);
          PHP

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    # The full run takes about 8 minutes; a hanging mutant holds a thread for the 120 s Infection timeout.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
      - name: Mutation tests on changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          vendor/bin/infection --threads=max --git-diff-lines
          --git-diff-base=origin/"$BASE_REF"
          --min-covered-msi=95 --logger-github --ignore-msi-with-no-mutations
      - name: Mutation tests (full)
        if: github.event_name != 'pull_request'
        run: vendor/bin/infection --threads=max --logger-github

  mcp-sdk-0-9:
    name: mcp/sdk 0.9.0 (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
      - name: Remove symfony/mcp-bundle, which requires mcp/sdk ^0.8.1
        run: composer remove --dev --no-update symfony/mcp-bundle
      - name: Install the mcp/sdk 0.9.0 tag
        run: composer require --dev --no-interaction --update-with-all-dependencies "mcp/sdk:0.9.0"
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github --configuration=phpstan.no-bundle.neon
      - run: vendor/bin/phpunit --testsuite Contract,Integration,E2E

  runtime:
    name: Runtime delivery (Docker, PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
      - name: Build the CLI and Swoole images and pull the others
        run: |
          docker build --tag agentcat-runtime-cli:8.3.35 tests/Runtime/docker
          docker build --tag agentcat-runtime-swoole:6.2.3-php8.3 tests/Runtime/docker/swoole
          for image in php:8.3.35-fpm-bookworm php:8.3.35-apache-bookworm dunglas/frankenphp:1.13.1-php8.3.35-bookworm unit:1.34.2-php8.3; do docker pull "$image"; done
      - run: vendor/bin/phpunit --testsuite Runtime --group runtime
        env:
          AGENTCAT_RUNTIME_TESTS: '1'

  package:
    name: Package probe (PHP 8.3, mcp/sdk ${{ matrix.mcp-sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mcp-sdk: ['0.8.1', '0.9.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - name: Install the dist in a fresh project and track an mcp/sdk server
        run: tests/bin/package-probe.sh "$MCP_SDK"
        env:
          MCP_SDK: ${{ matrix.mcp-sdk }}

  bc:
    name: Backward compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: bcmath
          coverage: none
      - name: Compare with the latest 1.x tag
        run: |
          base="$(git tag --list 'v1.*' --sort=-v:refname | head -n 1)"
          if [ -z "$base" ]; then echo "No v1.* tag yet: nothing to compare against (D63)."; exit 0; fi
          composer global require --no-interaction roave/backward-compatibility-check:8.19.0
          "$(composer global config bin-dir --absolute)/roave-backward-compatibility-check" --from="$base" --format=github-actions --install-development-dependencies

  all-green:
    name: All green
    if: always()
    needs: [static, static-lowest, tests, coverage, mutation, mcp-sdk-0-9, runtime, package, bc]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
