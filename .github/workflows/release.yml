name: Release

# Two steps, with a pull request between them, as in the Java and Rust SDKs. CONTRIBUTING.md ("Release a version") has
# the steps and the one-time setup.
#
# 1. A manual run (Actions > Release > Run workflow) with `patch` (the default), `minor`, `major` or an exact version
#    X.Y.Z opens the pull request "Release vX.Y.Z". It dates the [Unreleased] section of the CHANGELOG
#    (`php tests/bin/release.php prepare`). The SDK has no version file: composer.json has no `version`, and Packagist
#    reads each version from its tag. A pull request that GITHUB_TOKEN opens starts no workflow, so the run starts
#    ci.yml on the release branch itself.
# 2. The merge of that pull request into main publishes the version: when the newest dated section of the CHANGELOG
#    has no tag (`php tests/bin/release.php status`), the run waits for the ci.yml run of the merge commit, and then
#    creates the tag vX.Y.Z. The tag is the publication: the GitHub hook of Packagist reads it, and the run waits until
#    Packagist lists the version. Last, the run creates the GitHub release of the tag.
#
# Packagist takes no upload and needs no credential: GITHUB_TOKEN creates the tag. Unlike the Java and Rust SDKs, the
# tag comes first here, so `status` also prints `publish` when the tag is on the merge commit itself, and each step
# after the tag skips the work that is done. A re-run of the failed jobs, or of all jobs, of that run continues the
# release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major, or an exact version X.Y.Z
        required: true
        default: patch
        type: string
  push:
    branches: [main]
    paths:
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGIST_METADATA: https://repo.packagist.org/p2/agentcat/sdk.json

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: The run is on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release workflow on main, not on $GITHUB_REF_NAME"
          exit 1
      # The full history holds the tags that the next version counts from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # tests/bin/release.php needs only PHP, on the lowest version that the SDK supports: no composer install.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - name: Date the CHANGELOG
        id: prepare
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(php tests/bin/release.php prepare "$INPUT" "$(date -u +%F)")"
          # Packagist reads each version from its tag, so a tag or a Packagist version stops the release.
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::The repository already has the tag v$version"
            exit 1
          fi
          packagist="$(curl -sSf "$PACKAGIST_METADATA")"
          if jq -e --arg v "$version" 'any(.packages["agentcat/sdk"][]; (.version | ltrimstr("v")) == $v)' <<<"$packagist" > /dev/null; then
            echo "::error::Packagist already has agentcat/sdk $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add CHANGELOG.md
          git commit -m "Release v$VERSION"
          git push origin "$branch"
          php tests/bin/release.php notes "$VERSION" > notes.md
          {
            echo "Merging this pull request tags \`v$VERSION\`, which publishes \`agentcat/sdk\` $VERSION on Packagist, then creates its GitHub release with these notes:"
            echo
            cat notes.md
          } > body.md
          gh pr create --base main --head "$branch" --title "Release v$VERSION" --body-file body.md
          gh workflow run ci.yml --ref "$branch"

  status:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.status.outputs.version }}
      publish: ${{ steps.status.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - name: Is this version released?
        id: status
        run: |
          set -euo pipefail
          # The assignment, unlike a here-string, stops the step when the status step fails.
          result="$(php tests/bin/release.php status)"
          read -r version action <<<"$result"
          echo "agentcat/sdk $version: $action"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$action" = publish ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: status
    if: needs.status.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    # The environment limits the job to main, as in the other SDKs. Packagist needs no credential from it.
    environment:
      name: release
      url: https://packagist.org/packages/agentcat/sdk#v${{ needs.status.outputs.version }}
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      # The CI run of this push to main checks the commit on every PHP and MCP library version; the tag comes only
      # when it passes.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 85); do
            read -r status conclusion <<<"$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs | sort_by(.run_attempt) | last | "\(.status // "none") \(.conclusion // "none")"')"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "CI passed on $GITHUB_SHA"
                exit 0
              fi
              echo "::error::CI on $GITHUB_SHA ended with $conclusion; re-run CI, then re-run this job"
              exit 1
            fi
            sleep 60
          done
          echo "::error::CI on $GITHUB_SHA did not finish in time"
          exit 1
      # The checkout keeps GITHUB_TOKEN in the git config: the next step pushes the tag with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag on this commit is a re-run after a push that went through: the step skips it. A tag on another commit
      # stops the release. The job never moves or deletes a tag.
      - name: Tag the commit
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # An annotated tag names its commit on the `^{}` line, a lightweight tag on its own line.
          tagged="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | sort -k2 | tail -n 1 | cut -f1)"
          if [ "$tagged" = "$GITHUB_SHA" ]; then
            echo "$tag already tags $GITHUB_SHA"
            exit 0
          fi
          if [ -n "$tagged" ]; then
            echo "::error::$tag already tags $tagged, not $GITHUB_SHA; the release does not move a tag"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
      # Packagist reads the new tag when its GitHub hook tells it of the push. The GitHub release comes only when
      # `composer require agentcat/sdk` can install the version.
      - name: Wait for Packagist
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if packagist="$(curl -sSf "$PACKAGIST_METADATA")" \
                && jq -e --arg v "$VERSION" 'any(.packages["agentcat/sdk"][]; (.version | ltrimstr("v")) == $v)' <<<"$packagist" > /dev/null; then
              echo "Packagist lists agentcat/sdk $VERSION"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Packagist does not list agentcat/sdk $VERSION after 30 minutes. Check the Packagist hook (Settings > Webhooks > https://packagist.org/api/github) and its recent deliveries, or press Update on https://packagist.org/packages/agentcat/sdk as a maintainer; then re-run the failed jobs"
          exit 1

  github-release:
    needs: [status, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      # A re-run after a release that went through skips the release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The GitHub release v$VERSION exists"
            exit 0
          fi
          php tests/bin/release.php notes "$VERSION" > notes.md
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md
